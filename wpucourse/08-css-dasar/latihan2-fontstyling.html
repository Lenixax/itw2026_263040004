<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: darkgrey;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: rgb(139, 139, 139);
            text-shadow: 5px 5px 0 rgb(139, 139, 139);
        }
        .lirik {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
        }
        span {
            color: rgb(165, 165, 165);
            text-decoration: line-through;
        }
        .credit {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(214, 214, 214);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>"Kesederhanaan Kode"</h1>
    <p class="lirik">"Simplicity is <span>prerequisite</span> for reliability.<br>"
        (Kesederhanaan adalah <span>syarat</span> utama dari keandalan.)<br>
    </p>

    <p class="credit">— Edsger W. Dijkstra</p>
    
</body>
</html>
