<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: rgb(249, 249, 250);
            text-align: center;
            background-color: rgb(15, 22, 41);
            background-image: linear-gradient( to bottom, rgb(15 23 42/80%) 60%, rgb(15 23 42/40%) ), url(https://picsum.photos/id/10/1000/1000);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        h1 {
            font-size: 4em;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            
            background-image: linear-gradient(to right, rgb(65, 183, 219) 50%, rgb(197, 29, 197));
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 204, 255, 0.705))
        }
        .lirik {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
            background-color: rgb(255 255 255/5%);
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgb(255 255 255/20%);
            box-shadow: 0px 10px 30px rgb(0 0 0/50%);
        }
        span {
            color: crimson;
            text-decoration: none;
            text-shadow: 0 0 10px rgb(220 20 60/80%);
        }
        .credit {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(214 214 214/65%);
            font-weight: normal;
            text-transform: uppercase;
            border-top: 1px solid rgb(255 255 255/20%);
            width: 30%;
            margin: 30px auto;
            padding-top: 20px;
            
        }
    </style>
</head>
<body>
    <h1>"Kesederhanaan Kode"</h1>
    <p class="lirik">"Simplicity is <span>prerequisite</span> for reliability.<br>"
        (Kesederhanaan adalah <span>syarat</span> utama dari keandalan.)<br>
    </p>

    <p class="credit">— Edsger W. Dijkstra</p>
    
</body>
</html>
