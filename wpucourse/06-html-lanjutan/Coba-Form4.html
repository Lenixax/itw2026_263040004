<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Form di dalam tabel</title>
</head>
<body>
    <h1>Contoh elemen-elemen Form pada HTML</h1>
   
    <form>
        <table cellpadding="4">
            <tr>
                <td align="right"><label for="nama">Nama:</label></td>
                <td><input type="text" name="nama" placeholder="Nama Anda" id="nama"></td>
            </tr>
            <tr>
                <td align="right"><label for="password">Password:</label></td>
                <td><input type="password" name="password" placeholder="Password Anda" id="password"></td>
            </tr>
            <tr>
                <td align="right"><label for="email">Email:</label></td>
                <td><input type="email" name="email" id="email"></td>
            </tr>
            <tr>
                <td align="right"><label for="number">Number:</label></td>
                <td><input type="number" name="number" id="number" min="1" max="100" step="2"></td>
            </tr>
            <tr>
                <td align="right"><label for="date">Tanggal:</label></td>
                <td><input type="date" name="date" id="date"></td>
            </tr>
            <tr>
                <td align="right"><label for="color">Warna:</label></td>
                <td><input type="color" name="color" id="color"></td>
            </tr>
            <tr>
                <td> <button type="submit">Kirim!</button></td>
            </tr>
        </table>

</body>
</html>
