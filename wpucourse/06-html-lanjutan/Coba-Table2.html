<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Simple Tabel</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Kolam 1</th>
                <th>Kolam 2</th>
            </tr>
        </thead>
        <tbody>
        <tr>
            <th>Baris 1</th>
            <td>Baris 1,Kolam 1</td>
            <td>Baris 1,Kolam 2</td>
        </tr>

        <tr>
            <th>Baris 2</th>
            <td>Baris 2,Kolam 1</td>
            <td>Baris 2,Kolam 2</td>
        </tr>
        </tbody>
    </table>

</body>

</html>
