<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select & Textarea</title>
</head>
<body>
    <h3>Pilih Kota</h3>
    <form>
        <select name="kota" id="kota">
            <option>--- Pilih Salah Satu---</option>
            <option value="jkt">Jakarta</option>
            <option value="bdg">Bandung</option>
            <option value="sby">Surabaya</option>
            <option value="clg" selected>Cilegon</option>
            <option value="Srg">Serang</option>
            <option value="bgr">Bogor</option>
        </select>
        <br>

        <h3>About me</h3>
        <textarea name="about" id="about" rows="4" cols="50" placeholder="isi data diri anda"></textarea>

        <button type="submit">Kirim</button>
    </form>
    
</body>
</html>
