<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Form</title>
</head>
<body>
    <h1>Contoh elemen-elemen Form pada HTML</h1>
   
    <form>
         <label for="nama">Nama:</label>
        <input type="text" name="nama" placeholder="Nama Anda" id="nama">
        
        <br>
        <label for="password">Password:
            <input type="password" name="password" placeholder="Password Anda" id="password">
        </label>

        <br>
        <label for="email">Email:
            <input type="email" name="email" id="email">
        </label>

        <br>
        <label for="number">Number:
            <input type="number" name="number" id="number" min="1" max="100" step="2">
        </label>

        <br>
        <label for="date">Tanggal:
            <input type="date" name="date" id="date">
        </label>

        <br>
        <label for="color">Warna:
            <input type="color" name="color" id="color">

        <br>
        <button type="submit">Kirim!</button>
     </form>

    
</body>
</html>
